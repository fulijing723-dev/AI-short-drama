<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AI短剧 · 正在加载</title>
  <style>
    html,body{height:100%;margin:0;background:#050b0a;color:#eff8f3;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
    main{height:100%;display:grid;place-content:center;gap:12px;text-align:center}.spin{width:34px;height:34px;margin:auto;border:3px solid #20332b;border-top-color:#a9ff32;border-radius:50%;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}p{margin:0;color:#91a69d;font-size:14px}
  </style>
</head>
<body>
  <main><div class="spin" aria-hidden="true"></div><strong>AI短剧评审沙盒加载中</strong><p>正在准备41个可交互页面…</p></main>
  <script>
    (async()=>{
      const count=9;
      try{
        const parts=await Promise.all(Array.from({length:count},(_,i)=>fetch(`parts/${String(i).padStart(3,'0')}.txt`).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})));
        document.open();document.write(parts.join(''));document.close();
      }catch(error){document.querySelector('main').innerHTML='<strong>页面加载失败</strong><p>请刷新页面后重试。</p>'}
    })();
  </script>
</body>
</html>
